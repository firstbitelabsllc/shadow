<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Pilot Puppy</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Your coding chief of staff</p>
        <h1>Pilot Puppy</h1>
      </div>
      <div class="topbar-actions">
        <div class="views">
          <button id="view-board" type="button" class="view-toggle">Board</button>
          <button id="view-briefs" type="button" class="view-toggle active">Briefs</button>
        </div>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </header>
    <div id="board" class="board" hidden></div>
    <div class="shell">
      <nav aria-label="Projects">
        <h2>Projects</h2>
        <div id="projects" class="projects"></div>
      </nav>
      <main id="main" tabindex="-1" aria-live="polite">
        <p class="loading">Reading your plans…</p>
      </main>
    </div>
  </body>
</html>
