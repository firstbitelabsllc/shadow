<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vidux browser</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script>
    // FOUC guard: apply persisted theme before first paint. Without this,
    // the page renders with OS theme briefly, then flips to the stored
    // override when app.js runs (defer = post-parse). Inline + synchronous
    // = no flash. Mirrors getStoredTheme/resolveTheme logic in app.js;
    // any change there must update this block too.
    (function () {
      try {
        var stored = localStorage.getItem('vidux:theme') || 'system';
        var resolved = (stored === 'light' || stored === 'dark')
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('theme-dark', resolved === 'dark');
        document.documentElement.classList.toggle('theme-light', resolved === 'light');
        // Stash the resolved theme so app.js can paint the toggle button
        // icon on its first run without re-deriving. The button itself has
        // empty textContent in HTML so it stays blank until app.js fills it
        // (avoids briefly showing the wrong icon).
        window.__viduxInitialTheme = resolved;
      } catch (e) { /* localStorage disabled — fall back to @media */ }
      try {
        // Same FOUC guard, for Simple/Advanced mode: apply the class to
        // <html> before first paint (document.body doesn't exist yet this
        // early in <head> -- documentElement does, same reason the theme
        // guard above uses it) so the read-aloud player bar and annotation
        // FAB (static markup below, CSS-hidden outside .advanced-mode)
        // don't flash visible then disappear once app.js runs.
        if (localStorage.getItem('vidux:advancedMode') === '1') {
          document.documentElement.classList.add('advanced-mode');
        }
      } catch (e) { /* localStorage disabled -- defaults to Simple, which is safe */ }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" async></script>
  <script src="/static/sidebar-sort.js" defer></script>
  <script src="/static/sidebar-filters.js" defer></script>
  <script src="/static/annotation-state.js" defer></script>
  <script src="/static/comment-rail.js" defer></script>
  <script src="/static/comment-markers.js" defer></script>
  <script src="/static/app.js" defer></script>
  <script type="module" src="/static/readaloud.js" defer></script>
</head>
<body>
  <a href="#pane" class="skip-link">Skip to content</a>
  <header class="topbar" data-vidux-zone="status-header">
    <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Toggle sidebar">☰</button>
    <h1>vidux browser</h1>
    <div class="topbar-meta">
      <span id="meta-count">…</span>
      <button id="mode-toggle" type="button" aria-pressed="false">Advanced view</button>
      <button id="theme-toggle" type="button" title="Toggle light/dark theme" aria-label="Toggle light or dark theme"></button>
      <button id="refresh" type="button" title="Re-scan">↻ refresh</button>
    </div>
  </header>

  <main class="layout" data-vidux-zone="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="plans" data-vidux-zone="navigation-sidebar">
      <div class="sidebar-search sidebar-controls">
        <label for="filter" class="visually-hidden">Filter plans</label>
        <input id="filter" type="search" placeholder="Search plans by name or purpose" aria-label="Filter plans by repo, slug, or purpose" />
        <label for="sort" class="visually-hidden">Sort plans</label>
        <select id="sort" aria-label="Sort plans">
          <option value="mtime">Recently updated</option>
          <option value="eta">ETA</option>
          <option value="status">Status</option>
        </select>
        <div class="sidebar-filter-chips" role="group" aria-label="Quick filters">
          <button type="button" class="filter-chip" data-filter-chip="hot" aria-pressed="false">hot</button>
          <button type="button" class="filter-chip" data-filter-chip="tasks" aria-pressed="false">tasks</button>
          <button type="button" class="filter-chip" data-filter-chip="eta" aria-pressed="false">ETA</button>
        </div>
      </div>
      <div class="sidebar-list" id="sidebar-list" role="listbox" aria-label="Plans and artifacts" tabindex="0">
        <p class="muted">loading…</p>
      </div>
    </aside>

    <section class="pane" id="pane" tabindex="-1" data-vidux-zone="content-pane">
      <div class="pane-empty muted">
        <p>Select a plan from the sidebar.</p>
        <p>40+ PLAN.md files indexed across <code>~/Development/</code>.</p>
      </div>
    </section>
  </main>

  <button id="root-annotation-toggle" class="annotation-fab" type="button" title="Select a plan or artifact to annotate" aria-label="Select a plan or artifact to annotate" aria-pressed="false" data-vidux-zone="floating-action" data-annotation-state="unavailable" disabled>Annotate</button>

  <div id="readaloud-player" class="readaloud-player" role="region" aria-label="Read-aloud player" aria-describedby="readaloud-player-status" data-vidux-zone="footer-player">
    <button id="root-readaloud-toggle" class="root-readaloud-toggle readaloud-player-read" type="button" title="Read aloud (local Voxtral MLX)" aria-label="Read current selection or pane aloud">Read</button>
    <button id="readaloud-player-toggle" class="readaloud-player-toggle" type="button" title="Play or pause read-aloud" aria-label="Play read-aloud" aria-pressed="false">▶</button>
    <div class="readaloud-player-main">
      <div id="readaloud-player-status" class="readaloud-player-status" role="status" aria-live="polite" aria-atomic="true">Ready</div>
      <button id="readaloud-server-command" class="readaloud-server-command" type="button" title="Copy local Voxtral MLX server command" aria-label="Copy local Voxtral MLX server command" hidden>browser/scripts/start-voxtral-mlx-server.sh</button>
      <input id="readaloud-player-seek" class="readaloud-player-seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Read-aloud position" />
    </div>
    <span id="readaloud-player-time" class="readaloud-player-time">0:00 / 0:00</span>
    <button id="root-readaloud-engine" class="root-readaloud-engine" type="button" title="Audio source: local Voxtral MLX server. Click to copy the server command." aria-label="Audio source: local Voxtral MLX server. Click to copy the server command.">MLX</button>
    <button id="readaloud-cache-clear" class="readaloud-cache-clear" type="button" title="No cached read-aloud segments for the current playback" aria-label="No cached read-aloud segments to clear" disabled>Cache</button>
    <button id="root-readaloud-speed" class="root-readaloud-speed" type="button" title="Read-aloud speed" aria-label="Read-aloud speed: 1.12x. Click to cycle.">1.12x</button>
  </div>
</body>
</html>
