<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 421" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Real Shadow session: shadow throw claims a checkpoint and prints its proof; after the work is committed, shadow accept reruns the proof, passes, and flips the row with PROOF and SOURCE receipt lines.">
  <title>Shadow loop — real session, trimmed</title>
  <style>
    .t { font-size: 13px; }
    .l { opacity: 0; animation: reveal 0.01s linear both; }
    @keyframes reveal { to { opacity: 1; } }
    .cursor { animation: blink 1.1s steps(1) infinite 0s; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .l { animation: none; opacity: 1; } .cursor { animation: none; } }
  </style>
  <rect width="880" height="421" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect width="880" height="30" rx="10" fill="#161b22"/>
  <rect y="20" width="880" height="10" fill="#161b22"/>
  <circle cx="20" cy="15" r="5.5" fill="#ff5f57"/><circle cx="38" cy="15" r="5.5" fill="#febc2e"/><circle cx="56" cy="15" r="5.5" fill="#28c840"/>
  <text x="440.0" y="19" text-anchor="middle" fill="#8b949e" font-size="12">~/projects/readme-demo — zsh</text>
  <g class="l" style="animation-delay:0.00s"><text x="36" y="46" class="t" fill="#e6edf3" font-weight="600">$ shadow throw --repo . --task '~a1b2' --by demo</text></g><g class="l" style="animation-delay:0.50s"><text x="36" y="67" class="t" fill="#8b949e" font-weight="400">[throw] ~a1b2 claimed by demo on this computer</text></g><g class="l" style="animation-delay:1.00s"><text x="36" y="88" class="t" fill="#79c0ff" font-weight="600">/goal readme-demo — first proof</text></g><g class="l" style="animation-delay:1.50s"><text x="36" y="109" class="t" fill="#8b949e" font-weight="400">AUTHORITY: PLAN.md @ this computer … — section &quot;### M1 — first proof&quot;</text></g><g class="l" style="animation-delay:2.00s"><text x="36" y="130" class="t" fill="#c9d1d9" font-weight="400">RESUME: [pending] hello.txt exists with today's greeting ~a1b2</text></g><g class="l" style="animation-delay:2.50s"><text x="36" y="151" class="t" fill="#c9d1d9" font-weight="400">PROOF: cmd test -f hello.txt</text></g><g class="l" style="animation-delay:3.00s"><text x="36" y="172" class="t" fill="#c9d1d9" font-weight="400">RAILS: … no proof, no completed; run `shadow lint` before mode flips …</text></g><g class="l" style="animation-delay:4.00s"><text x="36" y="214" class="t" fill="#8b949e" font-weight="400"># … you, Claude Code, or Codex does the work, then commits …</text></g><g class="l" style="animation-delay:5.00s"><text x="36" y="256" class="t" fill="#e6edf3" font-weight="600">$ shadow accept --entity &lt;id&gt; --repo . --row '~a1b2' --by demo</text></g><g class="l" style="animation-delay:5.50s"><text x="36" y="277" class="t" fill="#7ee787" font-weight="600">accepted ~a1b2: proof and final lint passed at</text></g><g class="l" style="animation-delay:6.00s"><text x="36" y="298" class="t" fill="#7ee787" font-weight="600">  local.shadow.invalid/1e89… HEAD a22fe1d…;</text></g><g class="l" style="animation-delay:6.50s"><text x="36" y="319" class="t" fill="#7ee787" font-weight="600">  local row flipped with its PROOF and SOURCE lines</text></g><g class="l" style="animation-delay:7.50s"><text x="36" y="361" class="t" fill="#d2a8ff" font-weight="600">- 02:09:21Z ~a1b2 PROOF test -f hello.txt -&gt; pass (accept)</text></g><g class="l" style="animation-delay:8.00s"><text x="36" y="382" class="t" fill="#d2a8ff" font-weight="600">- 02:09:21Z ~a1b2 SOURCE local.shadow.invalid/1e89… -&gt; proof and final lint</text></g><g class="l" style="animation-delay:8.50s"><rect x="36" y="371" width="8" height="14" fill="#7ee787" class="cursor"/></g>
</svg>