<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Shadow: board, claim, work, prove, accept, next — one closed loop with a checkpoint where any session can end and the next one resumes.">
  <title>shadow — You, one step down.</title>
  <style>
    .wordmark { font: 700 88px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: #767e87; letter-spacing: -2.5px; }
    .tagline  { font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: #8b949e; letter-spacing: 0.2px; }
    .word     { font: 500 16px ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; letter-spacing: 0.6px; }
    .word-cp  { font: 600 16px ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; fill: #6366f1; letter-spacing: 0.6px; }
    .sub      { font: 400 12px ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; letter-spacing: 0.4px; }

    .loop  { fill: none; stroke: #8b949e; stroke-width: 1.4; opacity: 0.5; }
    .ring  { fill: none; stroke: #8b949e; stroke-width: 1.4; opacity: 0.75; }
    .hint  { fill: none; stroke: #8b949e; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; opacity: 0.45; }

    .trail { fill: none; stroke: #6366f1; stroke-width: 2.4; stroke-linecap: round;
             animation: tail 9s linear infinite; opacity: 0.28; }
    .head  { fill: none; stroke: #6366f1; stroke-width: 2.4; stroke-linecap: round;
             animation: head 9s linear infinite; opacity: 0.85; }
    .spark { fill: none; stroke: #6366f1; stroke-width: 8; stroke-linecap: round;
             animation: spark 9s linear infinite; }

    /* path length = 1200 + 240pi = 1953.98 user units; the three layers share one leading edge */
    @keyframes tail  { from { stroke-dashoffset: 290; } to { stroke-dashoffset: -1663.98; } }
    @keyframes head  { from { stroke-dashoffset:  88; } to { stroke-dashoffset: -1865.98; } }
    @keyframes spark { from { stroke-dashoffset:   0; } to { stroke-dashoffset: -1953.98; } }

    /* each station lights as the pulse arrives, then settles back */
    .lit { fill: #6366f1; opacity: 0; animation: lit 9s linear infinite; }
    @keyframes lit { 0% { opacity: 0; } 2% { opacity: 1; } 14% { opacity: 0.18; } 34%, 100% { opacity: 0; } }

    .cp-halo { animation: breathe 9s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.30; } 50% { opacity: 0.62; } }

    @media (prefers-reduced-motion: reduce) {
      .trail, .head, .spark, .lit, .cp-halo { animation: none; }
      .lit { opacity: 0; }
      .cp-halo { opacity: 0.45; }
    }
  </style>

  <defs>
    <radialGradient id="halo">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#6366f1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- one closed path: board -> claim -> work -> prove -> accept -> (next) -> checkpoint -> board -->
  <path class="loop" d="M 300 60 H 900 A 120 120 0 0 1 900 300 H 300 A 120 120 0 0 1 300 60 Z"/>

  <!-- travelling pulse: faint trail, bright head, leading spark — three layers, one leading edge -->
  <path class="trail" stroke-dasharray="290 1663.98" d="M 300 60 H 900 A 120 120 0 0 1 900 300 H 300 A 120 120 0 0 1 300 60 Z"/>
  <path class="head"  stroke-dasharray="88 1865.98"  d="M 300 60 H 900 A 120 120 0 0 1 900 300 H 300 A 120 120 0 0 1 300 60 Z"/>
  <path class="spark" stroke-dasharray="0.01 1953.97" d="M 300 60 H 900 A 120 120 0 0 1 900 300 H 300 A 120 120 0 0 1 300 60 Z"/>

  <!-- direction hints -->
  <path class="hint" d="M 497 54 l 6 6 l -6 6"/>
  <path class="hint" d="M 703 294 l -6 6 l 6 6"/>

  <!-- wordmark, held inside the loop -->
  <text x="600" y="188" text-anchor="middle" class="wordmark">shadow</text>
  <text x="600" y="226" text-anchor="middle" class="tagline">You, one step down.</text>

  <!-- stations, in loop order -->
  <g>
    <circle cx="400" cy="60" r="6" class="ring"/>
    <circle cx="400" cy="60" r="4" class="lit" style="animation-delay: 0.46s"/>
    <text x="400" y="38" text-anchor="middle" class="word">board</text>

    <circle cx="600" cy="60" r="6" class="ring"/>
    <circle cx="600" cy="60" r="4" class="lit" style="animation-delay: 1.38s"/>
    <text x="600" y="38" text-anchor="middle" class="word">claim</text>

    <circle cx="800" cy="60" r="6" class="ring"/>
    <circle cx="800" cy="60" r="4" class="lit" style="animation-delay: 2.30s"/>
    <text x="800" y="38" text-anchor="middle" class="word">work</text>

    <circle cx="800" cy="300" r="6" class="ring"/>
    <circle cx="800" cy="300" r="4" class="lit" style="animation-delay: 4.96s"/>
    <text x="800" y="330" text-anchor="middle" class="word">prove</text>

    <circle cx="600" cy="300" r="6" class="ring"/>
    <circle cx="600" cy="300" r="4" class="lit" style="animation-delay: 5.88s"/>
    <text x="600" y="330" text-anchor="middle" class="word">accept</text>

    <circle cx="400" cy="300" r="6" class="ring"/>
    <circle cx="400" cy="300" r="4" class="lit" style="animation-delay: 6.80s"/>
    <text x="400" y="330" text-anchor="middle" class="word">(next)</text>
  </g>

  <!-- checkpoint: where the loop closes and a dead session hands off -->
  <g>
    <circle cx="180" cy="180" r="46" fill="url(#halo)" class="cp-halo"/>
    <circle cx="180" cy="180" r="12" fill="none" stroke="#6366f1" stroke-width="1.4" opacity="0.7"/>
    <circle cx="180" cy="180" r="5.5" fill="#6366f1"/>
    <circle cx="180" cy="180" r="9" class="lit" style="animation-delay: 8.13s"/>
    <text x="152" y="175" text-anchor="end" class="word-cp">checkpoint</text>
    <text x="152" y="195" text-anchor="end" class="sub">resume here</text>
  </g>
</svg>
