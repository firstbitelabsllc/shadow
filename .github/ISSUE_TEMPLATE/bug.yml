name: "Bug report"
description: "Something in vidux doesn't work as expected"
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include `vidux --version` output and a minimal repro.
  - type: input
    id: vidux-version
    attributes:
      label: "vidux version"
      description: "Output of `vidux --version` (or `cat VERSION` if not installed)"
      placeholder: "2.23.0"
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: "OS / shell"
      placeholder: "macOS 14.4 / zsh 5.9"
    validations: { required: true }
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: "What did you expect?"
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: "Minimal repro steps"
      description: "Numbered steps a stranger can follow."
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: "Relevant log output"
      render: shell
    validations: { required: false }
