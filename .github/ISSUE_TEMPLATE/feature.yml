name: "Feature request"
description: "Propose a new capability or surface for vidux"
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. Lead with the user-facing motivation; surface details can stay rough.
  - type: textarea
    id: motivation
    attributes:
      label: "Motivation"
      description: "What problem does this solve? Who feels the pain today, and how often?"
    validations: { required: true }
  - type: textarea
    id: proposed-surface
    attributes:
      label: "Proposed surface"
      description: "What does the CLI flag, slash command, file, or behavior look like? Rough is fine."
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
      description: "Other shapes you weighed and why this one wins."
    validations: { required: false }
  - type: textarea
    id: additional-context
    attributes:
      label: "Additional context"
      description: "Links, screenshots, prior art, related issues."
    validations: { required: false }
