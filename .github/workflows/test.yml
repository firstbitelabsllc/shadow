# ============================================================================
# DISABLED / MANUAL-ONLY POLICY 2026-06-22 — local-ci/Moussey own test proof.
#
# The former GitHub test matrix ran npm test across Ubuntu/macOS and multiple
# Python versions on push and pull_request. That is now intentionally disabled:
# local-ci/Moussey, local browser/runtime proof, and ledgered artifacts are the
# proof authority for FirstBite/Vidux work.
