# To re-enable automated PR/push tests, Leo must name a narrow exception and the
# /local-ci policy must be updated first.
# ============================================================================

name: Test matrix local-ci pointer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-ci-pointer:
    name: Test matrix runs locally
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Point to local proof
        run: |
          cat <<'MSG'
          GitHub PR/push test execution is disabled for this repo.

          Run the Vidux proof locally or through local-ci/Moussey, then cite the
          exact command and evidence path in the PR, plan, or ledger receipt.
          Do not treat this manual pointer workflow as test proof.
          MSG
