name: Test matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-test:
    name: npm test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install tomli (py3.10 only)
        if: matrix.python-version == '3.10'
        # scripts/vidux-doctor.sh uses `tomllib` (stdlib >= 3.11) and falls
        # back to the `tomli` backport on 3.10. Without it, reduce-harness
        # contract tests silently misroute. Stdlib-only repo otherwise.
        run: python -m pip install --upgrade pip tomli

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run npm test
        env:
          # browser/server.py imports `receipts` as a sibling package; tests
          # load server.py via importlib, so add browser/ to sys.path.
          PYTHONPATH: ./browser
        run: npm test
