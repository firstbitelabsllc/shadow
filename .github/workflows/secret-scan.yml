name: Secret scan

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  # A force-push can remove a secret-bearing PR head from later history. Only
  # coalesce duplicate attempts for the exact same checked-out SHA; every
  # distinct PR head and direct-main push keeps its own security scan.
  group: secret-scan-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # A PR scan must include a removed transient secret anywhere between
          # its base and head, not only the final working tree.
          fetch-depth: 0
      - name: Restore gitleaks binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks-linux-x64-8.30.1
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$HOME/.local/bin"
          if [ ! -x "$HOME/.local/bin/gitleaks" ]; then
            archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            extract_dir="$RUNNER_TEMP/gitleaks-bin"
            curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              --output "$archive"
            echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" \
              | sha256sum --check --strict
            mkdir -p "$extract_dir"
            tar -xzf "$archive" -C "$extract_dir" gitleaks
            install "$extract_dir/gitleaks" "$HOME/.local/bin/gitleaks"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan commit range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            log_opts="--diff-merges=first-parent ${PULL_REQUEST_BASE_SHA}..${PULL_REQUEST_HEAD_SHA}"
          elif [[ "$PUSH_BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            log_opts="--diff-merges=first-parent $PUSH_AFTER_SHA"
          else
            log_opts="--diff-merges=first-parent ${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
          fi
          gitleaks git --log-opts="$log_opts" --config .gitleaks.toml --redact --verbose

  public-ready-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Public-ready content and product metadata gate
        run: python3 scripts/shadow-public-ready-grep-gate.py --tracked-only --metadata
