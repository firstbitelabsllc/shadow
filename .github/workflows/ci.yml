# ============================================================================
# DISABLED / MANUAL-ONLY POLICY 2026-06-22 — local-ci/Moussey own test proof.
#
# Why: GitHub Actions minutes were burning through the multi-agent PR fleet.
# FirstBite/Vidux contract, plan-gc, worktree-gc, PR-body, merge, cycle-lock,
# and expensive regression proof now happens through local-ci/Moussey evidence,
# not PR/push GitHub Actions.
#
# Binding proof route:
#   - repo-owned local commands and local-ci/Moussey evidence own test proof
#   - ledger/plan receipts must cite the local command, result bundle, or
#     Moussey-held evidence packet
#   - GitHub checks may report mergeability, security, or cheap lint only
#
# To re-enable automated PR/push tests, Leo must name a narrow exception and the
# /local-ci policy must be updated first.
# ============================================================================

name: Vidux local-ci pointer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-ci-pointer:
    name: Tests run locally
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Point to local proof
        run: |
          cat <<'MSG'
          GitHub PR/push test execution is disabled for this repo.

          Use local-ci/Moussey or a repo-local command for proof, then cite the
          local command and evidence path in the PR, plan, or ledger receipt.
          Do not treat this manual pointer workflow as test proof.
          MSG
