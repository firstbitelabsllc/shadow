name: CI

# Git, Bash, Python. No Node, no npm — removed 2026-08-09 by owner ruling.
# All four existing CI contexts are load-bearing branch-protection checks:
# test (3.10), test (3.12), test (3.14), and browser-and-docs. Never skip the
# workflow by path; an unmapped path selects the full suite instead.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'
    - cron: '17 18 * * *'
    - cron: '47 */3 * * *'
  workflow_dispatch:
    inputs:
      accepted_change_count:
        description: Accepted trunk changes since the last release
        required: true
        default: '0'
        type: string
      oldest_accepted_change_hours:
        description: Age of the oldest accepted trunk change
        required: true
        default: '0'
        type: string
      severity:
        description: Highest accepted-change severity
        required: true
        default: none
        type: choice
        options: [none, low, medium, high, critical]
      release_risk:
        description: Highest release risk
        required: true
        default: none
        type: choice
        options: [none, low, medium, high, critical]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_checks: ${{ steps.plan.outputs.run_checks }}
      run_all: ${{ steps.plan.outputs.run_all }}
      modules_json: ${{ steps.plan.outputs.modules_json }}
      browser_modules_json: ${{ steps.plan.outputs.browser_modules_json }}
      release_contract: ${{ steps.plan.outputs.release_contract }}
      full_gauntlet: ${{ steps.plan.outputs.full_gauntlet }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          TWICE_DAILY: ${{ vars.SHADOW_TWICE_DAILY || '0' }}
          ACCEPTED_CHANGE_COUNT: ${{ inputs.accepted_change_count }}
          OLDEST_ACCEPTED_CHANGE_HOURS: ${{ inputs.oldest_accepted_change_hours }}
          SEVERITY: ${{ inputs.severity }}
          RELEASE_RISK: ${{ inputs.release_risk }}
        run: scripts/shadow-python.sh scripts/shadow-ci.py plan --github-output "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: >-
      always() &&
      (
        github.event_name == 'pull_request' ||
        github.event_name == 'push' ||
        needs.plan.outputs.run_checks == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Isolate Shadow runtime state
        shell: bash
        run: |
          scratch_home="$RUNNER_TEMP/shadow-home-${{ matrix.python-version }}"
          mkdir -p "$scratch_home/.config" "$scratch_home/.cache"
          {
            printf 'HOME=%s\n' "$scratch_home"
            printf 'XDG_CONFIG_HOME=%s\n' "$scratch_home/.config"
            printf 'XDG_CACHE_HOME=%s\n' "$scratch_home/.cache"
          } >> "$GITHUB_ENV"
      - name: Require a valid selection
        if: needs.plan.result != 'success'
        run: |
          echo "::error::CI selection failed; no test tier may be silently skipped"
          exit 1
      - name: Selected proof
        if: needs.plan.result == 'success'
        env:
          RUN_ALL: ${{ needs.plan.outputs.run_all }}
          MODULES_JSON: ${{ needs.plan.outputs.modules_json }}
        run: >-
          scripts/shadow-python.sh scripts/shadow-ci.py run
          --run-all "$RUN_ALL" --modules-json "$MODULES_JSON"
      - name: Plan lint
        # Shadow's operational plan is machine-local and never committed, so
        # this gate runs against the plan `shadow init` mints into the scratch
        # HOME above: the gate must accept what the product writes.
        if: needs.plan.result == 'success' && matrix.python-version == '3.12'
        run: |
          scripts/shadow-python.sh scripts/shadow-init.py --here
          scripts/shadow-python.sh scripts/shadow-lint.py "$HOME/.shadow/plans/shadow/PLAN.md"
      - name: Affected release contract
        if: >-
          needs.plan.result == 'success' &&
          matrix.python-version == '3.12' &&
          needs.plan.outputs.release_contract == 'true'
        run: scripts/shadow-python.sh scripts/shadow-release-package.py

  browser-and-docs:
    needs: plan
    if: >-
      always() &&
      (
        github.event_name == 'pull_request' ||
        github.event_name == 'push' ||
        needs.plan.outputs.run_checks == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Isolate Shadow runtime state
        run: |
          scratch_home="$RUNNER_TEMP/shadow-home-browser"
          mkdir -p "$scratch_home/.config" "$scratch_home/.cache"
          {
            printf 'HOME=%s\n' "$scratch_home"
            printf 'XDG_CONFIG_HOME=%s\n' "$scratch_home/.config"
            printf 'XDG_CACHE_HOME=%s\n' "$scratch_home/.cache"
          } >> "$GITHUB_ENV"
      - name: Require a valid selection
        if: needs.plan.result != 'success'
        run: |
          echo "::error::CI selection failed; browser-and-docs cannot silently skip"
          exit 1
      - name: Browser and documentation contracts
        if: needs.plan.result == 'success'
        env:
          MODULES_JSON: ${{ needs.plan.outputs.browser_modules_json }}
        run: >-
          scripts/shadow-python.sh scripts/shadow-ci.py run
          --modules-json "$MODULES_JSON"
      - name: Public-ready gate
        if: needs.plan.result == 'success'
        run: scripts/shadow-python.sh scripts/shadow-public-ready-grep-gate.py --tracked-only --metadata

  visual-proof:
    # The gallery under a real browser: styles applied, states differentiated,
    # console clean, screenshot kept as an artifact for human re-observation.
    # SHADOW_VISUAL=1 makes a missing browser a FAILURE, never a silent skip.
    needs: plan
    if: >-
      always() &&
      (
        github.event_name == 'pull_request' ||
        github.event_name == 'push' ||
        needs.plan.outputs.run_checks == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the browser harness
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Visual proof against /gallery
        env:
          SHADOW_VISUAL: '1'
          SHADOW_VISUAL_DIR: visual-artifacts
        run: python -m unittest tests.test_gallery_visual -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gallery-screenshot
          path: visual-artifacts/
          if-no-files-found: error

  release-gauntlet:
    needs: [plan, test, browser-and-docs, visual-proof]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.full_gauntlet == 'true' &&
      needs.test.result == 'success' &&
      needs.browser-and-docs.result == 'success' &&
      needs.visual-proof.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Full release gauntlet
        run: >-
          scripts/shadow-python.sh scripts/shadow-ci.py gauntlet
          --scratch-root "$RUNNER_TEMP/shadow-gauntlet"
