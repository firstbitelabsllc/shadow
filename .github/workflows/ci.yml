name: CI

# Git, Bash, Python. No Node, no npm — removed 2026-08-09 by owner ruling.
# tests/test_browser_shell.py fails if a package manifest or an npm/npx
# invocation ever returns to bin/, scripts/, or .github/.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # release:verify runs `git archive` against real history
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python unittest + plan lint
        run: |
          scripts/shadow-python.sh -m unittest discover -s tests -p 'test_*.py'
          scripts/shadow-python.sh scripts/shadow-lint.py PLAN.md
      - name: Release artifact contract
        run: scripts/shadow-python.sh scripts/shadow-release-package.py --allow-dirty

  # NAME IS LOAD-BEARING: `browser-and-docs` is a required status context in
  # branch protection. Renaming this job makes that context never report, which
  # blocks every PR forever. Rename only together with the protection rule.
  browser-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Stranger install (the documented path)
        run: |
          bash install.sh --bin-dir "${RUNNER_TEMP}/bin" --no-skills
          "${RUNNER_TEMP}/bin/shadow" --version
          "${RUNNER_TEMP}/bin/shadow" help >/dev/null
          "${RUNNER_TEMP}/bin/shadow" doctor --json >/dev/null || true
      - name: Public-ready gate
        run: scripts/shadow-python.sh scripts/shadow-public-ready-grep-gate.py --tracked-only --metadata

  visual-proof:
    # The gallery under a real browser: styles applied, states differentiated,
    # console clean, screenshot kept as an artifact for human re-observation.
    # SHADOW_VISUAL=1 makes a missing browser a FAILURE, never a silent skip.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the browser harness
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Visual proof against /gallery
        env:
          SHADOW_VISUAL: '1'
          SHADOW_VISUAL_DIR: visual-artifacts
        run: python -m unittest tests.test_gallery_visual -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gallery-screenshot
          path: visual-artifacts/
          if-no-files-found: ignore
