# ============================================================================
# DISABLED / MANUAL-ONLY POLICY 2026-06-22 — local-ci/Moussey own lint proof.
#
# The former PR workflow ran ruff and shellcheck on GitHub. That still burns
# runner minutes in multi-agent swarms and can turn policy-only PRs red. Run
# these checks locally or through local-ci/Moussey, then cite the evidence in
# the PR, plan, or ledger receipt.
#
# To re-enable automated PR/push lint, Leo must name a narrow exception and the
# /local-ci policy must be updated first.
# ============================================================================

name: Lint local-ci pointer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-ci-pointer:
    name: Lint runs locally
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Point to local proof
        run: |
          cat <<'MSG'
          GitHub PR/push lint execution is disabled for this repo.

          Run ruff/shellcheck locally or through local-ci/Moussey, then cite the
          exact command and evidence path in the PR, plan, or ledger receipt.
          Do not treat this manual pointer workflow as lint proof.
          MSG
